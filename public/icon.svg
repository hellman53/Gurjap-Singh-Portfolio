<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161616" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded Obsidian Squircle -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)" stroke="#262626" stroke-width="3" />

  <!-- Bold Modern Geometric 'G' Monogram for Gurjap Singh -->
  <path
    d="M 90 44
       C 82 34, 70 30, 56 30
       C 36 30, 24 44, 24 64
       C 24 84, 36 98, 56 98
       C 74 98, 88 88, 92 72
       L 92 64
       L 58 64"
    fill="none"
    stroke="url(#gGrad)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Electric Lime Cyber Core Dot (Portfolio Signature #D3FD50) -->
  <circle cx="94" cy="34" r="7" fill="#D3FD50" filter="url(#neonGlow)" />
</svg>
